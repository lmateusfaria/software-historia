name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: agenciatelabranca
  APP_NAME: bibliotecadigital

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build e Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.APP_NAME }}-backend:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.APP_NAME }}-backend:${{ github.run_number }}

      - name: Build e Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.APP_NAME }}-frontend:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.APP_NAME }}-frontend:${{ github.run_number }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Atualizar Servicos Locais no Ubuntu
        run: |
          cd ~/projects/software-historia
          git pull origin main
          docker compose pull bibliotecadigitalunifef-back bibliotecadigitalunifef-front
          docker compose --profile tunnel up -d --remove-orphans
          docker ps --filter "name=bibliotecadigitalunifef"

