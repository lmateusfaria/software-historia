services:
  atb-db-postgres:
    image: postgres:15-alpine
    container_name: atb-db-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=db_biblioteca_digital_unifef
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postdba
    ports:
      - "5432:5432"
    networks:
      - infra_default
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - infra_postgres_data:/var/lib/postgresql/data

  atb-minio:
    image: pgsty/silo:latest
    container_name: atb-minio
    init: true
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - infra_default
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - infra_minio_data:/data
    restart: unless-stopped

  atb-neo4j:
    image: neo4j:latest
    container_name: atb-neo4j
    init: true
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - infra_default
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/password123}
      - server.memory.heap.initial_size=256m
      - server.memory.heap.max_size=512m
      - server.memory.pagecache.size=256m
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - infra_neo4j_data:/data
      - infra_neo4j_logs:/logs
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: atb-prometheus
    init: true
    ports:
      - "9091:9090"
    networks:
      - infra_default
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - infra_prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: atb-grafana
    init: true
    ports:
      - "3003:3000"
    networks:
      - infra_default
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - infra_grafana_data:/var/lib/grafana
    restart: unless-stopped

networks:
  infra_default:
    external: true

volumes:
  infra_postgres_data:
    external: true
  infra_minio_data:
    external: true
  infra_neo4j_data:
    external: true
  infra_neo4j_logs:
    external: true
  infra_prometheus_data:
  infra_grafana_data:
